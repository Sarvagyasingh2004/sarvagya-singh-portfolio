<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Sarvagya Singh">
  <title>Sarvagya Singh</title>
  <defs>
    <linearGradient id="ssg" gradientUnits="userSpaceOnUse" x1="16" y1="10" x2="48" y2="54">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="55%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b6ef5"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#ssg)" stroke-width="6"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- upper S: bar, diagonal in, centre bar -->
    <path d="M44 14 H20"/>
    <path d="M20 14 L34 30"/>
    <path d="M34 30 H20"/>
    <!-- lower S mirrors it, sharing the centre bar -->
    <path d="M20 30 L34 46"/>
    <path d="M34 46 H20"/>
    <path d="M20 50 H44"/>
  </g>
</svg>
